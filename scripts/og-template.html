<!DOCTYPE html>
<!--
  카카오톡·네이버·X 에 링크를 붙였을 때 뜨는 미리보기 카드(og:image)의 원본이다.
  이 파일을 고친 뒤 `node scripts/generate-og-image.js` 를 돌리면 이미지가 다시 만들어진다.
  아래 h1 / .sub / .chips 안의 자리표시자는 생성기가 페이지마다 갈아 끼운다 —
  홈은 og-image.jpg, 나머지는 og/<이름>.jpg 로 나온다.
  (주석에 자리표시자를 그대로 적지 말 것: 치환이 주석에 먼저 걸려 제목이 안 바뀐다)
  크기는 1200x630 (og:image 표준 비율 1.91:1) 에 맞춰져 있으니 body 크기는 건드리지 말 것.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
    color: #fff; position: relative;
  }
  .curve { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; opacity: 0.5; }
  .inner { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }
  .brand { font-size: 30px; font-weight: 700; color: #a0aec0; letter-spacing: -0.5px; }
  h1 { font-size: 76px; font-weight: 800; line-height: 1.14; margin-top: 26px; letter-spacing: -2px; }
  h1 .hl { color: #fc8181; }
  .sub { font-size: 30px; color: #cbd5e0; margin-top: 22px; font-weight: 500; line-height: 1.45; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip {
    font-size: 23px; font-weight: 700; color: #90cdf4; padding: 10px 22px;
    border: 2px solid rgba(144,205,244,0.45); border-radius: 999px; background: rgba(99,179,237,0.10);
  }
  .foot { margin-top: auto; display: flex; align-items: baseline; gap: 20px; }
  .domain { font-size: 46px; font-weight: 800; color: #63b3ed; letter-spacing: -1px; }
  .foot .note { font-size: 24px; color: #718096; font-weight: 500; }
</style>
</head>
<body>
  <svg class="curve" viewBox="0 0 1200 300" preserveAspectRatio="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#63b3ed" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0,40 C90,30 140,120 210,150 C280,180 330,90 400,70 C470,50 520,200 600,235
             C680,270 730,160 800,130 C870,100 920,215 1000,240 C1080,265 1140,150 1200,110
             L1200,300 L0,300 Z" fill="url(#g)"/>
    <path d="M0,40 C90,30 140,120 210,150 C280,180 330,90 400,70 C470,50 520,200 600,235
             C680,270 730,160 800,130 C870,100 920,215 1000,240 C1080,265 1140,150 1200,110"
          fill="none" stroke="#63b3ed" stroke-width="4"/>
  </svg>
  <div class="inner">
    <div class="brand">📊 MDD 분석기</div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUB}}</div>
    <div class="chips">{{CHIPS}}</div>
    <div class="foot">
      <span class="domain">mddcalc.com</span>
      <span class="note">투자 조언 아님 · 참고용 데이터</span>
    </div>
  </div>
</body>
</html>
