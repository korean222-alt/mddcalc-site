name: Refresh stock report pages

# scripts/generate-stock-pages.js를 매주 자동 실행해서 /stock/*.html의 실데이터
# (현재가, ATH, 하락 구간 표 등)를 최신 상태로 갱신하고 main에 직접 커밋한다.
# 필요 조건: 이 저장소의 Settings > Secrets and variables > Actions 에
# TWELVE_DATA_API_KEY 라는 이름으로 시크릿을 등록해야 동작한다.
#
# 수동으로 지금 바로 돌리고 싶으면: Actions 탭 > Refresh stock report pages
# > Run workflow 버튼으로 즉시 실행 가능 (workflow_dispatch).

on:
  schedule:
    - cron: '0 3 * * 1' # 매주 월요일 03:00 UTC (한국시간 낮 12시경)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 이 배치가 쓰는 21 회를 사이트와 같은 장부(api_usage 테이블)에 적기 위한 것뿐입니다.
      # 실패해도 페이지 갱신은 그대로 갑니다.
      - name: Install DB client (for API usage accounting)
        continue-on-error: true
        run: npm install mysql2@^3 --no-save --no-audit --no-fund

      - name: Regenerate stock report pages
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # 없으면 기록만 건너뜁니다. 페이지 생성 자체는 영향받지 않습니다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "::error::TWELVE_DATA_API_KEY 시크릿이 설정되어 있지 않습니다. Settings > Secrets and variables > Actions 에서 추가해주세요."
            exit 1
          fi
          node scripts/generate-stock-pages.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock/ sitemap.xml tools.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "chore: weekly refresh of stock report pages"
            git push
          fi
