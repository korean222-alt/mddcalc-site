name: Refresh Korean stock data

# scripts/generate-kr-data.js 로 data/kr/*.json (한국 주식 일봉)을,
# scripts/generate-us-data.js 로 data/us/*.json (미국 종목 일봉)을 갱신하고,
# scripts/generate-sector-rs.js 로 둘을 합쳐 data/sectors.json (섹터 RS)을 만든다.
# API 키가 필요 없다.
#
# 사용자 브라우저는 이 결과 파일만 읽는다. 즉 시세 소스가 불안정해도 그 영향은
# 이 워크플로우 안에서 끝나고, 사이트는 항상 마지막으로 성공한 데이터를 서빙한다.
# 일부 종목이 실패하면 그 종목만 지난 데이터를 유지하고 나머지는 갱신된다.
#
# 지금 바로 돌리려면: Actions 탭 > Refresh Korean stock data > Run workflow
# (ref 를 골라 브랜치에서도 돌릴 수 있다)

on:
  schedule:
    # 한국장 마감 뒤. 이 실행에서 한국 데이터가 당일 종가로 갱신된다.
    - cron: '30 9 * * 1-5'  # 09:30 UTC = 한국시간 18:30
    #
    # 미국장 마감 뒤. 위 실행 시각(09:30 UTC)에는 미국장이 아직 열리지도 않아서,
    # 그때 받는 미국 데이터는 늘 한 거래일 전 종가다. 그래서 한 번 더 돈다.
    # 미국장 마감은 서머타임 20:00 UTC / 겨울 21:00 UTC 이므로 22:30 UTC 면 연중 안전하다.
    - cron: '30 22 * * 1-5' # 22:30 UTC = 다음날 한국시간 07:30
    #
    # 두 번째 실행에서 한국 데이터는 대개 그대로다. 바뀐 게 없으면 커밋하지 않으므로
    # (아래 "Commit and push if changed") 저장소가 불필요하게 커지지 않는다.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 미국 수집이 심볼당 8.5초(Twelve Data 무료 플랜의 분당 8회 제한)라 209심볼이면
    # 30분 안팎입니다. 여유를 두되, 어딘가 멈춰 러너를 6시간 붙잡는 일은 막습니다.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # ref 를 고정하지 않는다. workflow_dispatch 로 고른 브랜치에서 그대로 돌게 해서
        # main 에 넣기 전에 브랜치에서 먼저 검증할 수 있도록 한다.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 파서를 두 번 잘못 고쳐서 두 번 다 실행 로그를 보고서야 알았습니다.
      # 실제 응답을 픽스처로 박아둔 테스트를 먼저 돌려, 망가진 파서로 60번 요청하는 일을 막습니다.
      - name: Test the response parsers
        run: |
          node scripts/test-kr-parse.js
          node scripts/test-us-parse.js

      # 섹터 RS 산식도 같은 이유로 먼저 검사합니다. 순위나 비중이 뒤집혀 있어도 화면에는
      # 그럴듯한 막대가 그려지기 때문에, 눈으로는 잘못된 걸 알 수 없습니다.
      - name: Test the sector RS math
        run: node scripts/test-sector-rs.js

      # 공포·탐욕 지수도 같은 이유로 먼저 검사합니다. 0~100 짜리 심리 지표는 부호가 뒤집혀
      # 폭락장에 "극단적 탐욕"이 떠도 화면만 봐서는 알 수 없습니다.
      - name: Test the fear & greed math
        run: |
          node scripts/test-fear-greed.js
          node scripts/test-cnn-parse.js

      # PAGE_URLS 표가 assets/site.js 와 index.html 두 곳에 복제돼 있어 한쪽만 고치기
      # 쉽습니다. 어긋나면 링크가 죽는 대신 홈으로 되돌아와서 "눌러도 아무 일이 없는" 것처럼
      # 보입니다. 실제로 섹터 페이지 추가 때 그렇게 됐습니다.
      - name: Test navigation links
        run: node scripts/test-nav-links.js

      - name: Generate Korean stock data
        run: node scripts/generate-kr-data.js

      # 미국 종목. 이 스텝은 절대 잡을 죽이면 안 됩니다.
      # 2026-08-23 실행에서 야후가 러너 IP를 막아 심볼이 전부 429였는데, 그 실패가
      # 잡을 종료시켜 바로 앞에서 성공한 한국 101종목까지 커밋되지 못했습니다.
      # 스크립트 자체도 exit 1 하지 않지만, 예기치 못한 크래시까지 막으려고 한 겹 더 둡니다.
      #
      # 무료 소스(야후·Stooq)는 러너 IP 를 막습니다. Twelve Data 키가 있으면 그걸 씁니다.
      # 키가 없어도 스텝은 통과합니다 — 그 경우 미국 탭이 지난 데이터로 남습니다.
      #
      # 아침(09:30 UTC) 실행에서는 건너뜁니다. 그때는 미국장이 열리지도 않아서 받아봐야
      # 저녁 실행과 똑같은 종가인데, 심볼 209개 × 8.5초 = 약 30분과 API 호출 209회를 그냥 씁니다.
      # (Twelve Data 무료 플랜 하루 800회는 사용자 요청 경로와 나눠 쓰는 한도입니다)
      # 이 배치가 쓰는 209 회를 사이트와 같은 장부(api_usage 테이블)에 적기 위한 것뿐입니다.
      # 실패해도 시세 갱신은 그대로 갑니다 — 그때는 사이트가 보여 주는 오늘 사용량이
      # 실제보다 적게 나올 뿐입니다.
      - name: Install DB client (for API usage accounting)
        continue-on-error: true
        run: npm install mysql2@^3 --no-save --no-audit --no-fund

      - name: Generate US sector data
        if: github.event.schedule != '30 9 * * 1-5'
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # 없으면 기록만 건너뜁니다. 수집 자체는 영향받지 않습니다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generate-us-data.js

      # 위 두 단계가 만든 파일만 읽어 계산합니다. 네트워크를 쓰지 않습니다.
      # 한쪽 시장 데이터가 없으면 그 시장만 건너뛰고 나머지로 만듭니다.
      - name: Compute sector relative strength
        continue-on-error: true
        run: node scripts/generate-sector-rs.js

      # 미국 공포·탐욕은 CNN 공식 값을 그대로 씁니다. 못 받으면 기존 파일을 그대로 두고
      # 넘어갑니다(스크립트가 스스로 그렇게 합니다). 그 경우 아래 계산이 같은 방식으로
      # 미국 값을 채우고, 화면에는 "직접 계산했습니다"라고 표시됩니다.
      - name: Fetch the official CNN fear & greed index
        continue-on-error: true
        run: node scripts/fetch-cnn-fear-greed.js

      # 한국 지수를 계산하고, 위에서 받아둔 CNN 값과 합쳐 data/fear-greed.json 을 만듭니다.
      # 섹터 RS 와 같은 원본 파일만 읽습니다. 네트워크를 쓰지 않습니다.
      # 실패해도 잡을 죽이지 않습니다 — 그 경우 공포·탐욕 화면만 지난 값으로 남습니다.
      - name: Compute the fear & greed index
        continue-on-error: true
        run: node scripts/generate-fear-greed.js

      # 계산 결과를 HTML 안에 글자로 심습니다. 세 화면은 본문을 자바스크립트로 그리기 때문에,
      # 이게 없으면 크롤러가 보는 HTML 에는 숫자가 한 글자도 없습니다.
      - name: Write today's numbers into the pages
        continue-on-error: true
        run: node scripts/write-page-summaries.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data *.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "chore: refresh Korean stock data"

            # 이 잡은 5분 넘게 돕니다. 그 사이 누가 같은 브랜치에 푸시하면 여기서
            # non-fast-forward 로 거부되고, 방금 받은 시세가 통째로 버려집니다.
            # 실제로 한 번 그렇게 날렸습니다. 리베이스하고 다시 시도합니다.
            # 우리가 만드는 건 생성물뿐이라 남의 커밋 위에 얹어도 충돌할 일이 없습니다.
            for attempt in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                echo "푸시 성공 (시도 $attempt)"
                exit 0
              fi
              echo "푸시 거부됨 — 원격을 받아 리베이스 후 재시도 ($attempt/3)"
              git pull --rebase origin ${GITHUB_REF_NAME}
            done
            echo "::error::3번 시도했지만 푸시하지 못했습니다."
            exit 1
          fi
