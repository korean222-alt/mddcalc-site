name: Refresh Korean stock data

# scripts/generate-kr-data.js 로 data/kr/*.json (한국 주식 일봉)을,
# scripts/generate-us-data.js 로 data/us/*.json (미국 섹터 ETF)을 갱신하고,
# scripts/generate-sector-rs.js 로 둘을 합쳐 data/sectors.json (섹터 RS)을 만든다.
# API 키가 필요 없다.
#
# 사용자 브라우저는 이 결과 파일만 읽는다. 즉 시세 소스가 불안정해도 그 영향은
# 이 워크플로우 안에서 끝나고, 사이트는 항상 마지막으로 성공한 데이터를 서빙한다.
# 일부 종목이 실패하면 그 종목만 지난 데이터를 유지하고 나머지는 갱신된다.
#
# 지금 바로 돌리려면: Actions 탭 > Refresh Korean stock data > Run workflow
# (ref 를 골라 브랜치에서도 돌릴 수 있다)

on:
  schedule:
    - cron: '30 9 * * 1-5' # 평일 09:30 UTC = 한국시간 18:30, 장 마감 뒤
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # ref 를 고정하지 않는다. workflow_dispatch 로 고른 브랜치에서 그대로 돌게 해서
        # main 에 넣기 전에 브랜치에서 먼저 검증할 수 있도록 한다.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 파서를 두 번 잘못 고쳐서 두 번 다 실행 로그를 보고서야 알았습니다.
      # 실제 응답을 픽스처로 박아둔 테스트를 먼저 돌려, 망가진 파서로 60번 요청하는 일을 막습니다.
      - name: Test the response parsers
        run: |
          node scripts/test-kr-parse.js
          node scripts/test-us-parse.js

      # 섹터 RS 산식도 같은 이유로 먼저 검사합니다. 순위나 비중이 뒤집혀 있어도 화면에는
      # 그럴듯한 막대가 그려지기 때문에, 눈으로는 잘못된 걸 알 수 없습니다.
      - name: Test the sector RS math
        run: node scripts/test-sector-rs.js

      - name: Generate Korean stock data
        run: node scripts/generate-kr-data.js

      # 미국 섹터 ETF. 이 스텝은 절대 잡을 죽이면 안 됩니다.
      # 2026-08-23 실행에서 야후가 러너 IP를 막아 22심볼이 전부 429였는데, 그 실패가
      # 잡을 종료시켜 바로 앞에서 성공한 한국 101종목까지 커밋되지 못했습니다.
      # 스크립트 자체도 exit 1 하지 않지만, 예기치 못한 크래시까지 막으려고 한 겹 더 둡니다.
      #
      # 무료 소스(야후·Stooq)는 러너 IP 를 막습니다. Twelve Data 키가 있으면 그걸 씁니다.
      # 하루 800회 한도 중 여기서 쓰는 건 22회뿐이라 사용자 몫을 거의 건드리지 않습니다.
      # 키가 없어도 스텝은 통과합니다 — 그 경우 미국 탭이 뜨지 않을 뿐입니다.
      - name: Generate US sector data
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node scripts/generate-us-data.js

      # 위 두 단계가 만든 파일만 읽어 계산합니다. 네트워크를 쓰지 않습니다.
      # 한쪽 시장 데이터가 없으면 그 시장만 건너뛰고 나머지로 만듭니다.
      - name: Compute sector relative strength
        continue-on-error: true
        run: node scripts/generate-sector-rs.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data *.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "chore: refresh Korean stock data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
