name: Refresh CNN fear & greed

# CNN Business 공포·탐욕 지수를 받아 data/cnn-fear-greed.json 을 갱신하고,
# 그 값으로 data/fear-greed.json 의 미국 탭을 다시 만든다.
#
# 왜 별도 워크플로우인가:
#   Refresh Korean stock data 안에도 같은 단계가 있지만, 그 잡은 미국 시세 209심볼을 받느라
#   30분 넘게 돈다. CNN 은 요청 한 번이면 끝나는데 그 뒤에 매달려 있을 이유가 없다.
#   따로 두면 미국장 마감 직후 1분 만에 갱신되고, 시세 수집이 실패한 날에도 지수는 최신이 된다.
#
# 지금 바로 돌리려면: Actions 탭 > Refresh CNN fear & greed > Run workflow

on:
  schedule:
    # 미국장 마감 뒤. CNN 은 장중에도 갱신되지만 종가 기준 값이 확정되는 건 마감 뒤다.
    # 21:30 UTC = 서머타임 기준 마감 90분 뒤 / 겨울 30분 뒤.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# data/fear-greed.json 을 한국 데이터 워크플로우도 건드린다. 동시에 돌면서 서로의 커밋을
# 덮어쓰지 않도록 아래 push 는 리베이스 재시도를 한다(같은 파일을 양쪽 다 생성물로만 다룬다).
concurrency:
  group: fear-greed-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 파서를 먼저 검사한다. CNN 은 공식 문서가 있는 API 가 아니라 응답 모양이 예고 없이
      # 바뀔 수 있고, 그때 이상한 값을 화면에 올리는 것보다 지난 값을 지키는 게 낫다.
      - name: Test the CNN response parser
        run: node scripts/test-cnn-parse.js

      # 못 받으면 기존 파일을 그대로 두고 넘어간다(스크립트가 스스로 그렇게 한다).
      - name: Fetch the official CNN fear & greed index
        run: node scripts/fetch-cnn-fear-greed.js

      # 한국 지수까지 같이 다시 만든다. 네트워크를 쓰지 않고 커밋된 시세 파일만 읽는다.
      - name: Rebuild the fear & greed data
        run: node scripts/generate-fear-greed.js

      # 새 점수를 fear-greed.html 안에도 글자로 심습니다 (자바스크립트 없이 보이는 요약).
      - name: Write today's numbers into the pages
        continue-on-error: true
        run: node scripts/write-page-summaries.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cnn-fear-greed.json data/fear-greed.json fear-greed.html sector-rs.html heatmap.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "chore: refresh CNN fear & greed index"
            for attempt in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                echo "푸시 성공 (시도 $attempt)"
                exit 0
              fi
              echo "푸시 거부됨 — 원격을 받아 리베이스 후 재시도 ($attempt/3)"
              git pull --rebase origin ${GITHUB_REF_NAME}
            done
            echo "::error::3번 시도했지만 푸시하지 못했습니다."
            exit 1
          fi
